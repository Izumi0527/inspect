# ==========================================
# 企业级网络设备巡检系统 - 生产环境
# ==========================================
# 使用方式: docker-compose -f docker-compose.prod.yml up -d
# 停止服务: docker-compose -f docker-compose.prod.yml down
# 查看日志: docker-compose -f docker-compose.prod.yml logs -f [service]
# ==========================================
# 注意：生产环境部署前请确保：
# 1. 已配置 .env 文件或环境变量
# 2. 已修改所有默认密码和密钥
# 3. 已配置 SSL 证书（如使用 HTTPS）
# 4. 已配置 Nginx 反向代理
# ==========================================

# ===== 网络配置 =====
networks:
  inspect_network:
    driver: bridge

# ===== 服务定义 =====
services:
  # ===== PostgreSQL 数据库 (TimescaleDB) =====
  postgres:
    image: timescale/timescaledb:2.15.3-pg16
    container_name: inspect-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inspect_system}
      POSTGRES_USER: ${POSTGRES_USER:-inspect_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD 环境变量}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/database-init-complete.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/builtin-templates-complete.sql:/docker-entrypoint-initdb.d/02-templates.sql:ro
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./backups/postgres:/backups
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - inspect_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inspect_user} -d ${POSTGRES_DB:-inspect_system}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # ===== Redis 缓存 =====
  redis:
    image: redis:7-alpine
    container_name: inspect-redis-prod
    command: redis-server --requirepass ${REDIS_PASSWORD:?请设置 REDIS_PASSWORD 环境变量} --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
      - ./backups/redis:/backups
    networks:
      - inspect_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ===== 后端服务 (Go) =====
  backend:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
      target: release
    container_name: inspect-backend-prod
    environment:
      # 服务配置
      SERVER_HOST: 0.0.0.0
      # 生产环境默认仍使用 8000（通常由 Nginx 反向代理，不直接暴露宿主机端口）
      SERVER_PORT: 8000
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      LOG_FILE: logs/backend-go/app.log

      # 数据库连接
      DATABASE_URL: postgresql://${POSTGRES_USER:-inspect_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inspect_system}
      DATABASE_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DATABASE_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-40}
      DATABASE_POOL_RECYCLE: ${DB_POOL_RECYCLE:-3600}
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}
      TIMESCALE_ENABLED: ${TIMESCALE_ENABLED:-true}

      # Redis 连接
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

      # 安全配置
      SECRET_KEY: ${SECRET_KEY:?请设置 SECRET_KEY 环境变量}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?请设置 JWT_SECRET_KEY 环境变量}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}

      # CORS 和主机配置
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://yourdomain.com"]}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-yourdomain.com,api.yourdomain.com}

      # 报表配置
      REPORT_OUTPUT_DIR: data/reports/monitoring
      REPORTS_OUTPUT_DIR: data/reports

      # SMTP 邮件配置
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@yourdomain.com}
      FROM_NAME: ${FROM_NAME:-网络设备巡检系统}

      # 监控配置
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
      METRICS_PORT: 9090
      HEALTH_CHECK_ENABLED: true
      HEALTH_CHECK_INTERVAL: 30
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./backups:/app/backups
    ports:
      - "5514:5514"
      - "5514:5514/udp"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - inspect_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # ===== 前端服务 (Next.js) =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NODE_ENV: production
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.yourdomain.com}
    container_name: inspect-frontend-prod
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.yourdomain.com}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://api.yourdomain.com}
    depends_on:
      - backend
    volumes:
      # 将仓库 docs 挂载到前端容器，供 /docs 路由读取（只读）
      - ./docs:/app/docs:ro
    networks:
      - inspect_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ===== Nginx 反向代理 =====
  nginx:
    image: nginx:alpine
    container_name: inspect-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - inspect_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - with-nginx

  # ===== Prometheus 监控 =====
  prometheus:
    image: prom/prometheus:latest
    container_name: inspect-prometheus-prod
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - inspect_network
    restart: unless-stopped
    profiles:
      - monitoring

  # ===== Grafana 可视化 =====
  grafana:
    image: grafana/grafana:latest
    container_name: inspect-grafana-prod
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - inspect_network
    restart: unless-stopped
    profiles:
      - monitoring

# ===== 数据卷定义 =====
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
