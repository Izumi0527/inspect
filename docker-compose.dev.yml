# ===== 企业级网络设备巡检系统 - 开发环境配置 =====
# 开发环境专用配置，包含热重载、调试功能和开发工具
# 使用方式: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  # ===== 数据库服务覆盖配置 =====
  postgres:
    container_name: inspect-postgres-dev
    environment:
      POSTGRES_DB: inspect_system_dev
      POSTGRES_USER: inspect_dev
      POSTGRES_PASSWORD: dev_password_2024
    volumes:
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspect_dev -d inspect_system_dev"]

  redis:
    container_name: inspect-redis-dev
    command: redis-server --requirepass dev_redis_2024 --appendonly yes
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev_redis_2024", "ping"]

  # ===== 后端开发服务 (Go) =====
  backend:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
      target: development
    container_name: inspect-backend-dev
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000

      # 数据库连接配置
      DATABASE_URL: postgresql://inspect_dev:dev_password_2024@postgres:5432/inspect_system_dev
      DATABASE_POOL_SIZE: 10
      DATABASE_MAX_OVERFLOW: 20
      DATABASE_POOL_RECYCLE: 3600
      DB_AUTO_MIGRATE: "true"
      TIMESCALE_ENABLED: "true"
      REDIS_URL: redis://:dev_redis_2024@redis:6379/0

      # 应用配置
      SECRET_KEY: dev_secret_key_2024_very_long_and_secure
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: debug
      LOG_FILE: logs/backend-go/app.log
      REPORT_OUTPUT_DIR: data/reports/monitoring
      REPORTS_OUTPUT_DIR: data/reports
    volumes:
      - ./backend-go:/app
      - ./logs:/app/logs
      - ./data:/app/data
      - dev_cache:/go/pkg/mod
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - inspect_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===== 前端开发服务 =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        NODE_ENV: development
    container_name: inspect-frontend-dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8001
      NEXT_PUBLIC_WS_URL: ws://localhost:8001
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - inspect_network
    restart: unless-stopped
    command: pnpm dev

  # ===== 开发工具服务 =====
  
  # pgAdmin 数据库管理工具
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: inspect-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@inspect.dev
      PGADMIN_DEFAULT_PASSWORD: dev_admin_2024
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - inspect_network
    restart: unless-stopped

  # Redis Commander 缓存管理工具
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: inspect-redis-commander-dev
    environment:
      REDIS_HOSTS: local:redis:6379:0:dev_redis_2024
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - inspect_network
    restart: unless-stopped

# ===== 开发环境专用数据卷 =====
volumes:
  dev_cache:
    driver: local
  pgadmin_data:
    driver: local
