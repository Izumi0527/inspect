version: '3.8'

services:
  # ===== 开发环境服务配置 =====
  
  # PostgreSQL 数据库
  postgres-dev:
    image: postgres:16-alpine
    container_name: inspect-postgres-dev
    environment:
      POSTGRES_DB: inspect_system_dev
      POSTGRES_USER: inspect_dev
      POSTGRES_PASSWORD: dev_password_2024
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    networks:
      - inspect_dev_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspect_dev -d inspect_system_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis 缓存
  redis-dev:
    image: redis:7-alpine
    container_name: inspect-redis-dev
    command: redis-server --requirepass dev_redis_2024
    volumes:
      - redis_dev_data:/data
    ports:
      - "6380:6379"
    networks:
      - inspect_dev_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev_redis_2024", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # InfluxDB 时序数据库
  influxdb-dev:
    image: influxdb:2.7-alpine
    container_name: inspect-influxdb-dev
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: dev_admin
      DOCKER_INFLUXDB_INIT_PASSWORD: dev_admin_2024
      DOCKER_INFLUXDB_INIT_ORG: inspect_dev
      DOCKER_INFLUXDB_INIT_BUCKET: device_metrics_dev
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: dev_token_2024
    volumes:
      - influxdb_dev_data:/var/lib/influxdb2
    ports:
      - "8087:8086"
    networks:
      - inspect_dev_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Authorization: Token dev_token_2024", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 后端开发服务
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: inspect-backend-dev
    environment:
      DATABASE_URL: postgresql://inspect_dev:dev_password_2024@postgres-dev:5432/inspect_system_dev
      REDIS_URL: redis://:dev_redis_2024@redis-dev:6379/0
      INFLUXDB_URL: http://influxdb-dev:8086
      INFLUXDB_TOKEN: dev_token_2024
      INFLUXDB_ORG: inspect_dev
      INFLUXDB_BUCKET: device_metrics_dev
      SECRET_KEY: dev_secret_key_2024
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: debug
      RELOAD: "true"
    volumes:
      - ./backend:/app
      - dev_logs:/app/logs
    ports:
      - "8001:8000"
    depends_on:
      - postgres-dev
      - redis-dev
      - influxdb-dev
    networks:
      - inspect_dev_network
    restart: unless-stopped

networks:
  inspect_dev_network:
    driver: bridge

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  influxdb_dev_data:
    driver: local
  dev_logs:
    driver: local