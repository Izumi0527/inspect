version: '3.8'

services:
  # ===== 本地开发环境服务配置 =====
  # 此文件用于网络受限环境，使用预构建镜像避免构建问题
  
  # PostgreSQL 数据库
  postgres-dev:
    image: postgres:16-alpine
    container_name: inspect-postgres-dev-local
    environment:
      POSTGRES_DB: inspect_system_dev
      POSTGRES_USER: inspect_dev
      POSTGRES_PASSWORD: dev_password_2024
    volumes:
      - postgres_dev_local_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    networks:
      - inspect_dev_local_network
    restart: unless-stopped

  # Redis 缓存
  redis-dev:
    image: redis:7-alpine
    container_name: inspect-redis-dev-local
    command: redis-server --requirepass dev_redis_2024
    volumes:
      - redis_dev_local_data:/data
    ports:
      - "6380:6379"
    networks:
      - inspect_dev_local_network
    restart: unless-stopped

  # InfluxDB 时序数据库
  influxdb-dev:
    image: influxdb:2.7-alpine
    container_name: inspect-influxdb-dev-local
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: dev_admin
      DOCKER_INFLUXDB_INIT_PASSWORD: dev_admin_2024
      DOCKER_INFLUXDB_INIT_ORG: inspect_dev
      DOCKER_INFLUXDB_INIT_BUCKET: device_metrics_dev
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: dev_token_2024
    volumes:
      - influxdb_dev_local_data:/var/lib/influxdb2
    ports:
      - "8087:8086"
    networks:
      - inspect_dev_local_network
    restart: unless-stopped

  # 后端本地开发服务
  # 注意：在本地开发模式下，后端和前端通常在宿主机上运行
  # 此服务仅作为备用选项，建议使用本地 Python 环境
  backend-dev-local:
    image: python:3.11-slim
    container_name: inspect-backend-dev-local
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://inspect_dev:dev_password_2024@postgres-dev:5432/inspect_system_dev
      REDIS_URL: redis://:dev_redis_2024@redis-dev:6379/0
      INFLUXDB_URL: http://influxdb-dev:8086
      INFLUXDB_TOKEN: dev_token_2024
      INFLUXDB_ORG: inspect_dev
      INFLUXDB_BUCKET: device_metrics_dev
      SECRET_KEY: dev_secret_key_2024
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: debug
      RELOAD: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app
      - dev_local_logs:/app/logs
    ports:
      - "8001:8000"
    depends_on:
      - postgres-dev
      - redis-dev
      - influxdb-dev
    networks:
      - inspect_dev_local_network
    command: >
      bash -c "
        echo '安装系统依赖...' &&
        apt-get update && apt-get install -y gcc g++ libpq-dev curl &&
        echo '安装 uv...' &&
        pip install uv &&
        echo '安装 Python 依赖...' &&
        uv pip install --system -r requirements.txt &&
        echo '启动后端服务...' &&
        uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
      "
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  inspect_dev_local_network:
    driver: bridge

volumes:
  postgres_dev_local_data:
    driver: local
  redis_dev_local_data:
    driver: local
  influxdb_dev_local_data:
    driver: local
  dev_local_logs:
    driver: local