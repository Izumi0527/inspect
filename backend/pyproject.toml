[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inspect-system-backend"
version = "1.0.0"
description = "企业级网络设备巡检系统后端服务"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.11"

# 生产环境依赖
dependencies = [
    # Web 框架
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    # 数据库
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.28.0",
    "psycopg2-binary>=2.9.0",
    # 认证和安全
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    # 数据验证
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.1.0",
    # 缓存
    "redis>=5.0.0",
    # 日志
    "structlog>=23.2.0",
    # 配置管理
    "python-dotenv>=1.0.0",
    # 邮件发送
    "aiosmtplib>=3.0.0",
    # 任务队列
    "celery>=5.3.0",
    "apscheduler>=3.10.0",
    "croniter>=2.0.0",
    # 时间处理
    "python-dateutil>=2.8.0",
    # HTTP客户端
    "httpx>=0.25.0",
    "websockets>=15.0.1",
    "aiohttp>=3.12.15",
    # 网络协议
    "pysnmp>=4.4.12",         # SNMP协议支持
    "paramiko>=3.4.0",        # SSH协议支持
    "netmiko>=4.3.0",         # 网络设备SSH连接
    "netaddr>=1.2.1",         # 网络地址处理
    "ping3>=4.0.0",           # Ping功能
    "python-nmap>=0.7.1",     # Nmap扫描
    "influxdb-client>=1.44.0", # 时序数据库客户端
    # 数据处理和报表
    "pandas>=2.0.0",          # 数据处理
    "openpyxl>=3.1.0",        # Excel文件支持
    "xlsxwriter>=3.0.0",      # Excel写入支持
    "reportlab>=4.0.0",       # PDF报表生成
    "matplotlib>=3.7.0",      # 图表绘制库
]

# 开发环境依赖
[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.4.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "faker>=19.0.0",
]

[project.urls]
Homepage = "https://github.com/your-org/inspect-system"
Documentation = "https://your-org.github.io/inspect-system"
Repository = "https://github.com/your-org/inspect-system.git"
Issues = "https://github.com/your-org/inspect-system/issues"

[project.scripts]
inspect-dev = "src.main:dev_main"
inspect-migrate = "alembic:main"

# ===== 工具配置 =====

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations/versions
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E501"]
exclude = [".git", "__pycache__", ".venv", "migrations/versions"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# ===== UV 特定配置 =====

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.4.0",
]

[tool.uv.sources]
# 可以配置私有源或镜像源
# example-private = { url = "https://pypi.example.com/simple/" }