# ===== 企业级网络设备巡检系统 - 基础配置 =====
# 此文件作为基础配置，定义通用服务和网络
# 使用方式：
#   开发环境: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   生产环境: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.8'

# ===== 网络配置 =====
networks:
  inspect_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ===== 基础服务定义 =====
services:
  # PostgreSQL 数据库服务
  postgres:
    image: postgres:16-alpine
    networks:
      - inspect_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    networks:
      - inspect_network
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # InfluxDB 时序数据库服务
  influxdb:
    image: influxdb:2.7-alpine
    networks:
      - inspect_network
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

# ===== 数据卷定义 =====
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  influxdb_data:
    driver: local