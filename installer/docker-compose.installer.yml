name: inspect-installer

networks:
  inspect_network:
    driver: bridge

services:
  postgres:
    image: timescale/timescaledb:2.15.3-pg16
    container_name: inspect-postgres-installer
    environment:
      POSTGRES_DB: inspect_system_dev
      POSTGRES_USER: inspect_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run prepare-env.ps1 to generate}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "15500:5432"
    networks:
      - inspect_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspect_dev -d inspect_system_dev"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: inspect-redis-installer
    command: redis-server --requirepass ${REDIS_PASSWORD:?run prepare-env.ps1 to generate} --appendonly yes
    volumes:
      - ./data/redis:/data
    ports:
      - "26380:6379"
    networks:
      - inspect_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
