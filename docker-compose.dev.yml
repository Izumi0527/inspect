# ==========================================
# 企业级网络设备巡检系统 - 开发环境
# ==========================================
# 使用方式: docker-compose -f docker-compose.dev.yml up -d
# 停止服务: docker-compose -f docker-compose.dev.yml down
# 查看日志: docker-compose -f docker-compose.dev.yml logs -f [service]
# ==========================================

# ===== 网络配置 =====
networks:
  inspect_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ===== 服务定义 =====
services:
  # ===== PostgreSQL 数据库 (TimescaleDB) =====
  postgres:
    image: timescale/timescaledb:2.15.3-pg16
    container_name: inspect-postgres-dev
    environment:
      POSTGRES_DB: inspect_system_dev
      POSTGRES_USER: inspect_dev
      POSTGRES_PASSWORD: dev_password_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/database-init-complete.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/builtin-templates-complete.sql:/docker-entrypoint-initdb.d/02-templates.sql:ro
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "15500:5432"
    networks:
      - inspect_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspect_dev -d inspect_system_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===== Redis 缓存 =====
  redis:
    image: redis:7-alpine
    container_name: inspect-redis-dev
    command: redis-server --requirepass dev_redis_2024 --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "16379:6379"
    networks:
      - inspect_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev_redis_2024", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # ===== 后端服务 (Go) =====
  backend:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
      target: development
    container_name: inspect-backend-dev
    environment:
      # 服务配置
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: debug
      LOG_FILE: logs/backend-go/app-dev.log

      # 数据库连接
      DATABASE_URL: postgresql://inspect_dev:dev_password_2024@postgres:5432/inspect_system_dev
      DATABASE_POOL_SIZE: 10
      DATABASE_MAX_OVERFLOW: 20
      DATABASE_POOL_RECYCLE: 3600
      DB_AUTO_MIGRATE: "true"
      TIMESCALE_ENABLED: "true"

      # Redis 连接
      REDIS_URL: redis://:dev_redis_2024@redis:6379/0

      # 安全配置
      SECRET_KEY: dev_secret_key_2024_very_long_and_secure
      JWT_SECRET_KEY: dev_jwt_secret_key_2024
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 30

      # CORS 配置
      CORS_ORIGINS: '["http://localhost:3000", "http://127.0.0.1:3000"]'
      ALLOWED_HOSTS: '["*"]'

      # 报表配置
      REPORT_OUTPUT_DIR: data/reports/monitoring
      REPORTS_OUTPUT_DIR: data/reports
    volumes:
      - ./backend-go:/app
      - ./logs:/app/logs
      - ./data:/app/data
      - go_cache:/go/pkg/mod
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - inspect_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===== 前端服务 (Next.js) =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        NODE_ENV: development
    container_name: inspect-frontend-dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8001
      NEXT_PUBLIC_WS_URL: ws://localhost:8001
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - inspect_network
    restart: unless-stopped
    command: pnpm dev

  # ===== pgAdmin 数据库管理工具 =====
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: inspect-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@inspect.dev
      PGADMIN_DEFAULT_PASSWORD: dev_admin_2024
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - inspect_network
    restart: unless-stopped
    profiles:
      - tools

  # ===== Redis Commander 缓存管理工具 =====
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: inspect-redis-commander-dev
    environment:
      REDIS_HOSTS: local:redis:6379:0:dev_redis_2024
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - inspect_network
    restart: unless-stopped
    profiles:
      - tools

# ===== 数据卷定义 =====
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  go_cache:
    driver: local
  pgadmin_data:
    driver: local
